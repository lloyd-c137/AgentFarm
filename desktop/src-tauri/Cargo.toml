[package]
name = "agent-farm-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_farm"
path = "src/lib.rs"

[[bin]]
name = "agent-farm"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
rand = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
