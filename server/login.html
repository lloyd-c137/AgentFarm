<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Agent Farm</title>
<link rel="preload" href="fusion-pixel-12.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="px.css">
<style>
body { display: grid; place-items: center; padding: 24px 16px; }
.wrap { width: 100%; max-width: 372px; }
.sign { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; color: var(--paper-hi); text-shadow: 0 3px 0 var(--ol), 3px 0 0 var(--ol), -3px 0 0 var(--ol), 0 -3px 0 var(--ol); }
.sign svg { width: 36px; height: 36px; filter: drop-shadow(0 3px 0 var(--ol)); }
.sub { margin: 0 0 12px; text-align: center; color: var(--ink-muted); }
.go { width: 100%; margin-top: 18px; }
.foot { width: fit-content; max-width: 100%; margin: 14px auto 0; padding: 5px 12px 6px; text-align: center; color: var(--paper-hi); background: rgba(32, 20, 28, .82); box-shadow: 0 0 0 3px rgba(32, 20, 28, .82); }
.foot a { color: var(--y-3); }
.hint { margin: 3px 0 0; color: var(--ink-muted); }
</style>
</head>
<body>
<canvas id="farm-bg" aria-hidden="true"></canvas>
<main class="wrap">
  <div class="sign">
    <svg viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><rect x="5" y="6" width="2" height="5" fill="#3b7438"/><rect x="1" y="3" width="4" height="3" fill="#7fb450"/><rect x="2" y="2" width="2" height="1" fill="#b4d872"/><rect x="7" y="1" width="4" height="3" fill="#7fb450"/><rect x="8" y="0" width="2" height="1" fill="#b4d872"/><rect x="4" y="5" width="2" height="1" fill="#56943f"/><rect x="6" y="4" width="2" height="1" fill="#56943f"/><rect x="2" y="11" width="8" height="1" fill="#6e4630"/></svg>
    <span class="big">Agent Farm</span>
  </div>
  <div class="board">
    <div class="rim">
      <div class="paper">
        <p class="sub" id="sub">登录后看你自己的 AI 农场</p>
        <div class="px-tabs" role="tablist">
          <button type="button" role="tab" class="px-tab" id="t-login" aria-selected="true">登录</button>
          <button type="button" role="tab" class="px-tab" id="t-reg" aria-selected="false">注册</button>
        </div>
        <form id="f" novalidate>
          <label class="px-label" for="email">邮箱</label>
          <input class="px-input" id="email" type="email" autocomplete="email" required>
          <label class="px-label" for="pw">密码</label>
          <input class="px-input" id="pw" type="password" autocomplete="current-password" required minlength="8">
          <p class="hint" id="pw-hint" hidden>至少 8 位</p>
          <div id="again-wrap" hidden>
            <label class="px-label" for="pw2">再输一次密码</label>
            <input class="px-input" id="pw2" type="password" autocomplete="new-password">
          </div>
          <button class="px-btn go" type="submit" id="go">登录</button>
          <p class="err" id="err" role="alert"></p>
        </form>
      </div>
    </div>
    <i class="nail tl"></i><i class="nail tr"></i><i class="nail bl"></i><i class="nail br"></i>
  </div>
  <p class="foot">每个账户的农场、设备和任务完全分开 · <a href="./?demo">先逛逛演示农场</a></p>
</main>
<script src="farm-bg.js" defer></script>
<script>
(() => {
const $ = id => document.getElementById(id);
let mode = location.hash === '#register' ? 'reg' : 'login';
function setMode(m) {
  mode = m; const reg = m === 'reg';
  $('t-login').setAttribute('aria-selected', !reg); $('t-reg').setAttribute('aria-selected', reg);
  $('again-wrap').hidden = !reg; $('pw-hint').hidden = !reg;
  $('pw').autocomplete = reg ? 'new-password' : 'current-password';
  $('go').textContent = reg ? '注册并开垦农场' : '进入农场';
  $('sub').textContent = reg ? '注册一个账户，开垦你自己的农场' : '登录后看你自己的 AI 农场';
  $('err').textContent = '';
  history.replaceState(null, '', location.pathname + location.search + (reg ? '#register' : ''));
}
$('t-login').onclick = () => setMode('login');
$('t-reg').onclick = () => setMode('reg');
setMode(mode);

const MSG = { bad_email: '邮箱格式不对', weak_password: '密码至少 8 位', email_taken: '这个邮箱已经注册过了，直接登录吧', bad_login: '邮箱或密码不对', bad_request: '请求格式不对' };
$('f').addEventListener('submit', async e => {
  e.preventDefault(); const err = $('err'); err.textContent = '';
  const email = $('email').value.trim(), password = $('pw').value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = MSG.bad_email; $('email').focus(); return; }
  if (mode === 'reg') {
    if (password.length < 8) { err.textContent = MSG.weak_password; $('pw').focus(); return; }
    if (password !== $('pw2').value) { err.textContent = '两次密码不一样'; $('pw2').focus(); return; }
  } else if (!password) { err.textContent = '请输入密码'; $('pw').focus(); return; }
  $('go').disabled = true;
  try {
    const r = await fetch(mode === 'reg' ? '/api/register' : '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) { try { localStorage.setItem('af-email', email); } catch (x) {} const next = new URLSearchParams(location.search).get('next'); location.replace(next === 'setup' ? '/setup' : '/'); return; }
    err.textContent = j.error === 'locked' ? `失败次数太多，${j.retryAfterMin} 分钟后再试` : (MSG[j.error] || '出错了，稍后再试');
    if (j.error === 'email_taken') setTimeout(() => setMode('login'), 1200);
  } catch (x) { err.textContent = '连不上服务器'; }
  finally { $('go').disabled = false; }
});
try { const k = localStorage.getItem('af-email'); if (k) $('email').value = k; } catch (e) {}
})();
</script>
</body>
</html>
